name: Qualidade

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil E2E
        required: true
        default: complete
        type: choice
        options: [smoke, pull-request, complete, exploratory]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

jobs:
  quality:
    name: Gate PHP e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, mbstring, pdo_sqlite, xml, xmlwriter
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
      - run: composer release:check

  smoke:
    name: Smoke de commit
    needs: quality
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, mbstring, pdo_sqlite, xml, xmlwriter
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright install-deps chromium
      - run: composer e2e:prepare
      - run: npm run e2e:test:smoke
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-smoke-${{ github.run_attempt }}
          path: storage/app/e2e/artifacts
          retention-days: 7
          if-no-files-found: warn

  e2e:
    name: E2E ${{ matrix.shard }}/4
    needs: quality
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.profile != 'exploratory')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, mbstring, pdo_sqlite, xml, xmlwriter
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright install-deps chromium
      - run: composer e2e:prepare
      - name: Executar shard por ferramenta
        run: npm run e2e:test:ci -- --shard=${{ matrix.shard }}/4
        env:
          CI: 'true'
          E2E_SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: storage/app/e2e/artifacts
          retention-days: 14
          if-no-files-found: warn

  complete-browsers:
    name: Bateria completa multibrowser
    needs: quality
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.profile == 'complete')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, mbstring, pdo_sqlite, xml, xmlwriter
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        id: complete-browsers-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-complete-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - if: steps.complete-browsers-cache.outputs.cache-hit != 'true'
        run: npm run e2e:install:complete
      - run: npx playwright install-deps chromium firefox webkit
      - run: composer e2e:prepare
      - run: composer e2e:browser:complete
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-complete-multibrowser
          path: storage/app/e2e/artifacts
          retention-days: 14
          if-no-files-found: warn

  exploratory:
    name: Exploração controlada
    needs: quality
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'exploratory')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, mbstring, pdo_sqlite, xml, xmlwriter
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npx playwright install chromium && npx playwright install-deps chromium
      - run: composer e2e:prepare
      - run: composer e2e:browser:exploratory
        env:
          CI: 'true'
          E2E_EXPLORATION_SEED: '12012'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-exploratory
          path: storage/app/e2e/artifacts
          retention-days: 7
          if-no-files-found: warn

  executive-report:
    name: Relatório executivo
    needs: e2e
    if: always() && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-shard-*
          path: storage/app/e2e/shards
      - uses: actions/cache/restore@v4
        with:
          path: storage/app/e2e/history
          key: e2e-history-${{ github.base_ref || github.ref_name }}
          restore-keys: |
            e2e-history-main
            e2e-history-
      - name: Consolidar resultados
        run: |
          mkdir -p storage/app/e2e/history storage/app/e2e/executive
          mapfile -t reports < <(find storage/app/e2e/shards -type f -name results.json -print)
          test ${#reports[@]} -gt 0
          php scripts/e2e-report-history.php summarize \
            storage/app/e2e/executive/current.json \
            "${reports[@]}"
      - name: Gerar painel de saúde
        run: php scripts/e2e-governance.php dashboard storage/app/e2e/executive/current.json
      - name: Comparar falhas
        id: compare
        continue-on-error: true
        run: |
          php scripts/e2e-report-history.php compare \
            storage/app/e2e/executive/current.json \
            storage/app/e2e/history/baseline.json \
            storage/app/e2e/executive/comparison.json
      - name: Atualizar baseline local
        if: github.event_name != 'pull_request'
        run: cp storage/app/e2e/executive/current.json storage/app/e2e/history/baseline.json
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request'
        with:
          path: storage/app/e2e/history
          key: e2e-history-${{ github.ref_name }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-relatorio-executivo
          path: storage/app/e2e/executive
          retention-days: 30
      - name: Bloquear regressões novas
        if: steps.compare.outcome == 'failure'
        run: exit 1
