name: Qualidade

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  quality:
    name: Gate PHP e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, mbstring, pdo_sqlite, xml, xmlwriter
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
      - name: Matriz Prazzu Plus (Free x Plus)
        run: php artisan test tests/Architecture/PlusFeatureAccessContractTest.php tests/Architecture/PlusFeatureGovernanceContractTest.php
      - run: composer release:check
      - name: Validar pacote de distribuição
        shell: pwsh
        run: ./scripts/package-distribution.ps1 -OutputPath "${{ runner.temp }}/prazzu-tools-distribuicao.zip"
